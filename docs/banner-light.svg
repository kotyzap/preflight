  <text x="56" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" letter-spacing="3" fill="#c2410c">PREFLIGHT FOR OS 13 · 4XS.DEV</text>
