  <text x="56" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#5c6270">Which Axis cameras survive the upgrade — before you start it. Read-only, nothing installed on the camera.</text>
